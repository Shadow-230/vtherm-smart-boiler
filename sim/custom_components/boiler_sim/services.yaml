# The boiler simulator's scenario services (test only, never part of a release). Every service
# the simulator registers is described here, with its fields: Home Assistant reads this file for
# the actions' names and forms, and logs an error at start without it.
set_outdoor:
  name: Set the outdoor temperature
  description: The simulated outdoor temperature, which the weather entity and the boiler's outdoor sensor show.
  fields:
    temperature:
      name: Temperature
      description: The outdoor temperature in °C.
      required: true
      example: -5
      selector:
        number:
          min: -40
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
fail_signal:
  name: Fail a signal
  description: >-
    A signal's entity becomes unavailable (or, for the gateway, out of reach: its commands are
    dropped; "gateway_all" also takes every boiler signal the gateway carries; "relay" reports no
    state while it stays available). Call again with "failed" off to bring it back.
  fields:
    signal:
      name: Signal
      description: The signal, the gateway, the relay or a boiler fault flag to fail.
      required: true
      example: flow
      selector:
        select:
          options:
            - flame
            - flow
            - return
            - modulation
            - ch_setpoint
            - dhw_active
            - pressure
            - outdoor
            - ch_active
            - pump_running
            - weather
            - gateway
            - gateway_all
            - relay
            - thermostat_setpoint
            - low_pressure_fault
            - boiler_lockout
            - fault_indication
    failed:
      name: Failed
      description: On (default) fails the signal; off brings it back.
      default: true
      selector:
        boolean:
force_setpoint:
  name: Another controller writes the setpoint
  description: >-
    Another controller holds the boiler's flow setpoint at this value, as an outside change the
    plugin must notice. Leave the value empty to stop it and clear the override.
  fields:
    value:
      name: Value
      description: The flow setpoint in °C; empty stops the other controller.
      example: 62
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
          unit_of_measurement: "°C"
ignore_writes:
  name: Ignore writes
  description: >-
    Writes are ignored: at the gateway, dropped without an acknowledgement; in the boiler, behind
    a gateway that acknowledges and shows them.
  fields:
    enabled:
      name: Enabled
      description: On (default) ignores writes; off takes them again.
      default: true
      selector:
        boolean:
    at:
      name: Where
      description: Where the writes are ignored (default gateway).
      default: gateway
      selector:
        select:
          options:
            - gateway
            - boiler
refuse_id1:
  name: Refuse the control setpoint (ID 1)
  description: >-
    The boiler answers the control setpoint (OpenTherm ID 1) with Data-Invalid, which clears the
    gateway's override without a message.
  fields:
    enabled:
      name: Enabled
      description: On (default) refuses it; off takes it again.
      default: true
      selector:
        boolean:
start_dhw:
  name: Start hot water
  description: The boiler heats domestic hot water for a while, as a draw or a tank's charge.
  fields:
    minutes:
      name: Minutes
      description: How long hot water runs (default 10 minutes).
      default: 10
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
set_topology:
  name: Set the gateway topology
  description: >-
    A gateway with a thermostat behind it (without an override the boiler follows its own curve)
    or stand-alone (without an override the boiler does not heat). Refused with a wall thermostat
    or a relay, which decide that themselves.
  fields:
    topology:
      name: Topology
      description: With a thermostat, or stand-alone.
      required: true
      example: standalone
      selector:
        select:
          options:
            - with_thermostat
            - standalone
set_zone_mode:
  name: Set a zone's mode
  description: >-
    A simulated zone as VT has it: heating, off (its valve closed) or VT's "sleep" (off, with its
    valve held open).
  fields:
    zone:
      name: Zone
      description: The zone's ID in the simulator's layout.
      required: true
      example: living
      selector:
        text:
    mode:
      name: Mode
      description: Heat, off or sleep.
      required: true
      example: "off"
      selector:
        select:
          options:
            - heat
            - "off"
            - sleep
set_room_temperature:
  name: Set a room's temperature
  description: A simulated room's temperature, set at once; the house model goes on from it.
  fields:
    zone:
      name: Zone
      description: The zone's ID in the simulator's layout.
      required: true
      example: living
      selector:
        text:
    temperature:
      name: Temperature
      description: The room temperature in °C.
      required: true
      example: 19.5
      selector:
        number:
          min: -30
          max: 40
          step: 0.1
          unit_of_measurement: "°C"
reset_gateway:
  name: Reset the gateway
  description: >-
    The gateway restarts: out of reach for a few seconds, its overrides lost, its stored values
    read 0 until read again.
drop_override:
  name: Drop the override once
  description: >-
    The boiler drops the override once, with no trace of an outage, and runs on its own regulation
    until the next write.
clip_setpoint:
  name: Clip the setpoint
  description: >-
    The setpoint is held at or below this value: at the gateway, shown in its read-back; in the
    boiler, behind the gateway and not shown. Leave the value empty to stop clipping.
  fields:
    value:
      name: Value
      description: The highest setpoint in °C that gets through; empty stops clipping.
      example: 45
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
          unit_of_measurement: "°C"
    at:
      name: Where
      description: Where the setpoint is clipped (default gateway).
      default: gateway
      selector:
        select:
          options:
            - gateway
            - boiler
restart_device:
  name: Restart the setpoint's device
  description: >-
    The device behind the writable setpoint (an ESPHome-like master) restarts: out of reach for a
    while, then back with what it was given lost — the setpoint and its heating switch at their
    own defaults.
  fields:
    seconds:
      name: Seconds
      description: How long the device is out of reach (default 10 s).
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
relay_restart:
  name: Restart the relay
  description: >-
    A power cut of the relay: it comes back in its state after a power cut. With "reported",
    Home Assistant sees it unavailable for a while first; without, it is found in that state at
    once.
  fields:
    reported:
      name: Reported
      description: On (default) shows the relay unavailable for a while; off does not.
      default: true
      selector:
        boolean:
relay_wifi_loss:
  name: Relay out of reach
  description: The relay loses Wi-Fi for a while; its contact and its own timer go on as they were.
  fields:
    minutes:
      name: Minutes
      description: How long the relay is out of reach.
      required: true
      example: 6
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
relay_switch:
  name: Switch the relay from outside
  description: >-
    Another controller — an automation, the relay's own button — switches the relay while it
    stays available.
  fields:
    "on":
      name: "On"
      description: On or off.
      required: true
      example: false
      selector:
        boolean:
set_wall_setpoint:
  name: Set the wall thermostat by hand
  description: The wall thermostat's setting changed by hand, as a person at the thermostat does.
  fields:
    temperature:
      name: Temperature
      description: The room setpoint in °C.
      required: true
      example: 20
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
set_fault:
  name: Set a boiler fault
  description: >-
    A boiler fault that stops the boiler while it holds: low water pressure or a lockout. The
    gateway's fault flags keep the last fault's state after it clears, as a real gateway does.
  fields:
    fault:
      name: Fault
      description: Which fault.
      required: true
      example: low_pressure_fault
      selector:
        select:
          options:
            - low_pressure_fault
            - boiler_lockout
    "on":
      name: "On"
      description: On (default) raises the fault; off clears it.
      default: true
      selector:
        boolean:
