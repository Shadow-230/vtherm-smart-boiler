# The simulated gateway's services, with the real integration's fields (test only).
set_control_setpoint:
  fields:
    gateway_id:
      required: true
      selector:
        text:
    temperature:
      required: true
      selector:
        number:
          min: 0
          max: 90
          step: 0.5
set_central_heating_ovrd:
  fields:
    gateway_id:
      required: true
      selector:
        text:
    ch_override:
      required: true
      selector:
        boolean:
set_max_modulation:
  fields:
    gateway_id:
      required: true
      selector:
        text:
    level:
      required: true
      selector:
        number:
          min: -1
          max: 100
send_transparent_command:
  fields:
    gateway_id:
      required: true
      selector:
        text:
    transp_cmd:
      required: true
      selector:
        text:
    transp_arg:
      required: true
      selector:
        text:
set_hot_water_ovrd:
  fields:
    gateway_id:
      required: true
      selector:
        text:
    dhw_override:
      required: true
      selector:
        text:
reset_gateway:
  fields:
    gateway_id:
      required: true
      selector:
        text:
