<!doctype html>
<!--
  The Boiler page on sample data, for screenshots (frontend/scripts/screenshots.mjs): a stand-in
  for Home Assistant's `hass` object and theme. Sample values only — no real installation.
  ?lang=en|pl, ?dark=1, ?user=1 (a user who is not an administrator).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boiler page preview</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    --primary-color: #03a9f4; --primary-background-color: #fafafa; --secondary-background-color: #e5e5e5;
    --card-background-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: rgba(0, 0, 0, 0.12); --app-header-background-color: #03a9f4;
    --app-header-text-color: #fff; --text-primary-color: #fff; --disabled-color: #bdbdbd;
    font-family: Roboto, system-ui, sans-serif;
  }
  body.dark {
    --primary-background-color: #111; --secondary-background-color: #282828;
    --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225, 225, 225, 0.12); --app-header-background-color: #1c1c1c;
    --disabled-color: #6f6f6f;
  }
</style>
</head>
<body>
<vtherm-smart-boiler-panel></vtherm-smart-boiler-panel>
<script type="module">
  import "/vtherm-smart-boiler-panel.js";

  const query = new URLSearchParams(location.search);
  const lang = query.get("lang") || "pl";
  if (query.get("dark")) document.body.classList.add("dark");
  const entity = (id, state, attributes = {}) =>
    [id, { entity_id: id, state, attributes, last_changed: "", last_updated: "" }];
  const zones = ["climate.living_room", "climate.bedroom", "climate.kids_room", "climate.kitchen", "climate.bathroom"];
  const states = Object.fromEntries([
    entity("sensor.control_state", "heating", {
      reasons_text: lang === "pl" ? "pokoje wołają o ciepło, woda według krzywej" : "rooms call for heat, water from the curve",
    }),
    entity("switch.control", "on"),
    entity("sensor.control_setpoint", "41.0", { requested: 41.0, read_back: 41.0 }),
    entity("sensor.flow", "40.6"),
    entity("sensor.return", "34.2"),
    entity("sensor.outdoor", "3.8"),
    entity("binary_sensor.flame", "on"),
    entity("sensor.modulation", "34"),
    entity("binary_sensor.dhw", "off"),
    entity("sensor.calling", "2", { calling_zones: zones.slice(0, 2) }),
  ]);
  const installation = {
    entry_id: "sample", title: "Boiler",
    boiler: { type: "single_tank", dhw: "storage", condensing: true },
    circuits: [{
      id: "c1", name: "Radiators", control: "unmixed_shared", fixed_temperature: null, max_flow: null,
      needed: null, zones: zones.map((z) => ({ entity_id: z, emitter: "radiator" })),
    }],
    signals: {
      flame: "binary_sensor.flame", flow: "sensor.flow", return: "sensor.return", outdoor: "sensor.outdoor",
      modulation: "sensor.modulation", dhw_active: "binary_sensor.dhw",
    },
    weather: null,
    entities: {
      control: "switch.control", control_state: "sensor.control_state",
      control_setpoint: "sensor.control_setpoint", demand_count: "sensor.calling",
    },
    curve: null,
  };
  const stateText = { heating: { pl: "Grzanie", en: "Heating" } };
  const hass = {
    language: lang, locale: { language: lang }, user: { is_admin: query.get("user") !== "1" }, states,
    callWS: async () => installation,
    callService: async (domain, service, data) => { window.lastCall = [domain, service, data]; },
    formatEntityState: (e) => stateText[e.state]?.[lang] ?? e.state,
  };
  const panel = document.querySelector("vtherm-smart-boiler-panel");
  panel.narrow = innerWidth < 600;
  panel.hass = hass;
</script>
</body>
</html>
