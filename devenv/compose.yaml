# The test Home Assistant, run in the dedicated test LXC only (docs/plan-0.2.md, J1).
# scripts/deploy_test.sh syncs this directory's neighbours to the LXC and starts it; nothing
# here is ever pointed at another Home Assistant.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3  # the version the plugin is built on
    container_name: ha-test
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "8123:8123"
    volumes:
      - ./config:/config
      # Everything under test is mounted read-only: the plugin, VT and SmartPI as vendored,
      # and the test-only simulator with the physics it imports (``sim``).
      - ./plugin/custom_components/vtherm_smart_boiler:/config/custom_components/vtherm_smart_boiler:ro
      - ./plugin/vendor/custom_components/versatile_thermostat:/config/custom_components/versatile_thermostat:ro
      - ./plugin/vendor/custom_components/vtherm_smartpi:/config/custom_components/vtherm_smartpi:ro
      - ./plugin/sim/custom_components/boiler_sim:/config/custom_components/boiler_sim:ro
      - ./plugin/sim:/config/sim:ro
