# The test Home Assistant, run in the dedicated test LXC only (docs/en/development/plans/plan-0.2.md, J1).
# scripts/deploy_test.sh copies this file, config/configuration.yaml and the integrations next to
# it on the LXC and starts it; nothing here is ever pointed at another Home Assistant. The
# container's name and port come from the .env the script writes beside it: ha-test on 8123 for
# the first test instance, ha-test-N on 8122 + N for instance N = 2-8 (--instance N). So does the
# Home Assistant version, which changes only on the user's word (--ha VERSION; the user,
# 2026-11-17): without it a deploy keeps the version the instance runs.
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:?the deploy writes HA_VERSION into .env}
    container_name: ${HA_CONTAINER:-ha-test}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${HA_PORT:-8123}:8123"
    volumes:
      - ./config:/config
      # Everything under test is mounted read-only: the plugin, the test-only simulator, which
      # carries its physics (Home Assistant keeps /config on the import path only while it
      # imports custom_components), and the test-only OpenTherm Gateway stub on it, which
      # overrides Home Assistant's own opentherm_gw in this instance only. VT and SmartPI as
      # vendored come from compose.vendored.yaml, which a deploy with --own-vt leaves out.
      - ./custom_components/vtherm_smart_boiler:/config/custom_components/vtherm_smart_boiler:ro
      - ./custom_components/boiler_sim:/config/custom_components/boiler_sim:ro
      - ./custom_components/opentherm_gw:/config/custom_components/opentherm_gw:ro
      # J4's test-only fault injector (sim/custom_components/j4_faults): loaded only where the
      # configuration names it, and never part of the plugin's release.
      - ./custom_components/j4_faults:/config/custom_components/j4_faults:ro
