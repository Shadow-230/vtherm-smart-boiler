# Test Home Assistant: only what the tests need. No default_config, so no network discovery
# looks around the local network.
homeassistant:
  name: Smart Boiler for Versatile Thermostat test

frontend:
config:
api:
history:
logbook:
system_log:
recorder:
  purge_keep_days: 14

logger:
  default: info
  logs:
    custom_components.vtherm_smart_boiler: debug
    custom_components.boiler_sim: info
    custom_components.opentherm_gw: info

# J4's scenario E7: the switch through which a circuit run by other automation asks for heat (its
# "Circuit asks for heat" entity), on and off by the runner.
input_boolean:
  j4_circuit_asks:
    name: J4 circuit asks for heat
  # J4's scenario I2 (plan-0.2-i11.md, I11.2): the switch through which the automation below
  # switches control, the only caller the action vtherm_smart_boiler.set_control takes.
  j4_set_control:
    name: J4 set control
  # I12.8: the helper VT's central boiler switches — VT decides whether the boiler heats; each
  # instance's VT central boiler must point its two commands at it (to be set at I12.15).
  j4_vt_central_boiler:
    name: J4 VT central boiler

automation:
  - id: j4_set_control
    alias: J4 set control
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.j4_set_control
        to:
          - "on"
          - "off"
    actions:
      - action: vtherm_smart_boiler.set_control
        data:
          enabled: "{{ trigger.to_state.state == 'on' }}"

# J4: this configuration's role, read by the runner before every scenario and by base.py
# (devenv/j4/run.py ROLES): a scenario runs only on an instance of its role.
input_text:
  j4_role:
    name: J4 role
    initial: gateway

# J4's test-only fault injector (sim/custom_components/j4_faults): makes the plugin's own monitor
# fail, starts the plugin on the stores a crash or another version leaves, or removes answers
# from its options — what the in-process acceptance tests do with patches. Test only: the plugin's
# release never contains it.
j4_faults:

# The simulated installation (sim/custom_components/boiler_sim): boiler, house, three radiator
# zones whose valves VT's thermostats drive, weather, a writable flow setpoint with a heating
# switch, and an OpenTherm wall thermostat on the gateway's terminals (21 °C 06:00–22:00, 17 °C
# otherwise, UTC). The gateway is the test-only stub integration "opentherm_gw"
# (sim/custom_components/opentherm_gw), set up in the user interface through its config flow:
# its entry has the ID below. The bedroom, where SmartPI learns, is light and has a large
# radiator, so that SmartPI's learning from scratch ends within hours, not days (L15; about
# 11 h in the simulator's model, sim/custom_components/boiler_sim/profiles.py).
boiler_sim:
  boiler: condensing_small
  house: average
  zones: radiators_light_bedroom
  valves: switch
  topology: with_thermostat
  write_type: expiring
  ch_write_type: held
  outdoor: 3.0
  gateway_id: sim
  wall_thermostat: opentherm
  # J4's relay phase (an on/off boiler, X8) instead: the relay's contact on the boiler's
  # room-thermostat terminals is then the boiler's heat demand, and the boiler's restart lockout
  # is the scenarios' 20 minutes (test-only). Uncomment, and drop wall_thermostat above.
  # relay:
  #   start_up: "off"
  #   off_timer_min: 10
  #   timer_restarts_on_repeat: true
  # restart_lockout_s: 1200
