# Test Home Assistant: only what the tests need. No default_config, so no network discovery
# looks around the local network.
homeassistant:
  name: VTherm Smart Boiler test

frontend:
config:
api:
history:
logbook:
system_log:
recorder:
  purge_keep_days: 14

logger:
  default: info
  logs:
    custom_components.vtherm_smart_boiler: debug
    custom_components.boiler_sim: info
    custom_components.opentherm_gw: info

# The simulated installation (sim/custom_components/boiler_sim): boiler, house, three radiator
# zones whose valves VT's thermostats drive, weather, a writable flow setpoint with a heating
# switch, and an OpenTherm wall thermostat on the gateway's terminals (21 °C 06:00–22:00, 17 °C
# otherwise, UTC). The gateway is the test-only stub integration "opentherm_gw"
# (sim/custom_components/opentherm_gw), set up in the user interface through its config flow:
# its entry has the ID below.
boiler_sim:
  boiler: condensing_small
  house: average
  zones: radiators
  valves: switch
  topology: with_thermostat
  write_type: expiring
  ch_write_type: held
  outdoor: 3.0
  gateway_id: sim
  wall_thermostat: opentherm
  # J4's relay phase (an on/off boiler, X8) instead: the relay's contact on the boiler's
  # room-thermostat terminals is then the boiler's heat demand, and the boiler's restart lockout
  # is the scenarios' 20 minutes (test-only). Uncomment, and drop wall_thermostat above.
  # relay:
  #   start_up: "off"
  #   off_timer_min: 10
  #   timer_restarts_on_repeat: true
  # restart_lockout_s: 1200
