# Test Home Assistant for J4's stand-alone gateway (docs/en/development/plans/plan-0.2.md, J4): an OpenTherm Gateway
# with no thermostat on its terminals, so without the plugin's override the boiler does not heat —
# a hand-back stops heating, as the control switch says. Deployed with
# `scripts/deploy_test.sh --instance N --config standalone`. No default_config, so no network
# discovery looks around the local network.
homeassistant:
  name: Smart Boiler for Versatile Thermostat test (stand-alone gateway)

frontend:
config:
api:
history:
logbook:
system_log:
recorder:
  purge_keep_days: 14

logger:
  default: info
  logs:
    custom_components.vtherm_smart_boiler: debug
    custom_components.boiler_sim: info
    custom_components.opentherm_gw: info

# J4's test-only fault injector (sim/custom_components/j4_faults), as in configuration.yaml.
j4_faults:

boiler_sim:
  boiler: condensing_small
  house: average
  zones: radiators
  valves: switch
  topology: standalone
  write_type: expiring
  ch_write_type: held
  outdoor: 3.0
  gateway_id: sim

# I12.8: the helper VT's central boiler switches, as in configuration.yaml — VT decides whether the
# boiler heats; the instance's VT central boiler points its two commands at it. Without it,
# control stays blocked.
input_boolean:
  j4_vt_central_boiler:
    name: J4 VT central boiler

# J4: this configuration's role, read by the runner before every scenario and by base.py
# (devenv/j4/run.py ROLES): a scenario runs only on an instance of its role.
input_text:
  j4_role:
    name: J4 role
    initial: standalone
