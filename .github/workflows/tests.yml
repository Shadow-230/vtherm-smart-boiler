# Tests, lint, formatting and types on every push and pull request
# (docs/en/development/plans/plan-0.2.md, K2; docs/en/development/plans/plan-0.2.1.md, R3), on the
# Home Assistant version tested and on the declared minimum (hacs.json). vendor/ (VT 10.6.5 and
# SmartPI 0.4.0) is not in the repository: CI fetches both on GitHub's servers by the full commit
# their release tags pointed at, so a tag moved later changes nothing, and so runs the real-VT
# tests on every change (docs/en/development/plans/plan-0.2.2.md, decision 14; PB-86; nothing is
# downloaded on the developer's machine). Coverage counts branches, and
# every module keeps its own floor (P-35). The canaries (newest vtherm_api; newest VT and
# SmartPI releases) are early warnings of a change upstream, not of ours: they run on demand and
# on pull requests into qas and main, not on every pull request (PB-85). GitHub runs a schedule
# only from the default branch, main, which holds no workflow until a release: so the canaries
# are started by hand on dev, weekly and before every pull request into qas (the user's decision,
# 2026-10-13). A pull request is checked once, up to date with its base, so the merge into dev
# is not checked again; pushes to qas and main are, as the last word before tests on a real
# Home Assistant and before a release. The tests run on every CPU
# (pytest-xdist). Actions are pinned to full commits (PB-86); the comment names the version.
# The tests are CPU-bound, so a run is split across jobs side by side (2026-11-18): for each
# Home Assistant version, four parts — the lint, types and core tests; test_acceptance.py;
# test_control.py; the rest, about a third of the Home Assistant tests' time each — then the
# job the rulesets require gathers the parts' coverage and checks every module's floor.
# The Boiler page (docs/en/development/plans/plan-0.2-i10.md) has its own job — its tests, its
# types, and the built files beside the plugin exactly as its source builds them — which the
# required jobs wait for.
name: Tests

on:
  push:
    branches: [qas, main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A pull request that changes documentation only (Markdown, docs/, LICENSE — not CLAUDE.md, not
  # the water interface's specification, which its contract test reads, nothing under .github/)
  # passes without the tests: no test reads those files. Anything else, and every push,
  # schedule and manual run, runs everything.
  changes:
    name: Documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      only: ${{ steps.docs.outputs.only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: docs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          only=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            files="$(git diff --name-only "$BASE" HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" \
                | grep -v -E '^(docs/.*|LICENSE|[^/]*\.md|[^.][^/]*/.*\.md)$' \
                | grep -q . && ! printf '%s\n' "$files" \
                | grep -q -E '^(CLAUDE\.md|\.github/|docs/en/specification/water-interface\.md)'; then
              only=true
              echo "Documentation only: tests skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "only=$only" >> "$GITHUB_OUTPUT"

  # One Home Assistant version and one part of the tests; each part's coverage goes to the job
  # that checks the floor (P-120: the core tests without Home Assistant's pytest plugin, sockets
  # closed, as that plugin keeps them; every other test with it).
  parts:
    name: ${{ matrix.label }} – ${{ matrix.part }}
    needs: changes
    if: needs.changes.outputs.only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [ha, ha-minimum]
        part: [core, acceptance, control, rest]
        include:
          - group: ha
            label: Supported Home Assistant
          - group: ha-minimum
            label: Oldest supported Home Assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-env
        with:
          group: ${{ matrix.group }}
      - name: The minimum is the version hacs.json declares
        if: matrix.group == 'ha-minimum' && matrix.part == 'core'
        run: |
          python - <<'PY'
          import json
          from homeassistant.const import __version__
          minimum = json.load(open("hacs.json", encoding="utf-8"))["homeassistant"]
          assert __version__ == minimum, (__version__, minimum)
          PY
      - name: Ruff
        if: matrix.part == 'core'
        run: ruff check .
      - name: Formatting
        if: matrix.part == 'core'
        run: ruff format --check .
      - name: Types
        if: matrix.part == 'core'
        run: mypy
      - name: Tests, ${{ matrix.part }}
        env:
          GROUP: ${{ matrix.group }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          coverage=(--cov --cov-branch --cov-report= --cov-fail-under=0)
          case "$PART" in
            core)
              python -m pytest -q -n auto -p no:homeassistant --disable-socket \
                --allow-unix-socket "${coverage[@]}" tests/core ;;
            acceptance)
              python -m pytest -q -n auto "${coverage[@]}" tests/integration/test_acceptance.py ;;
            control)
              python -m pytest -q -n auto "${coverage[@]}" tests/integration/test_control.py ;;
            rest)
              python -m pytest -q -n auto "${coverage[@]}" --ignore=tests/core \
                --ignore=tests/integration/test_acceptance.py \
                --ignore=tests/integration/test_control.py ;;
          esac
          mv .tmp/coverage ".tmp/coverage.$GROUP-$PART"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.group }}-${{ matrix.part }}
          path: .tmp/coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The Boiler page: its tests, its types (the build checks them first), and the files committed
  # beside the plugin, which HACS installs, the same as its source builds them.
  page:
    name: The Boiler page
    needs: changes
    if: needs.changes.outputs.only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Packages, as the lock file pins them
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: The committed page is the one its source builds
        run: |
          changed="$(git status --porcelain -- ../custom_components/vtherm_smart_boiler/frontend)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Build the page (npm run build in frontend/) and commit its files." >&2
            exit 1
          fi

  # The checks the rulesets require, by their names: every part of their Home Assistant version
  # passed — a part that failed uploads no coverage — and, P-35, every module at least 95 % with
  # branches over all four parts, the config and options flows 100 %.
  tests:
    name: ${{ matrix.label }}
    needs: [changes, parts, page]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ha
            label: "Tests – supported Home Assistant version"
          - group: ha-minimum
            label: "Tests – oldest supported Home Assistant version"
    steps:
      - name: Documentation only?
        id: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          ONLY: ${{ needs.changes.outputs.only }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "The documentation check did not run through: $CHANGES" >&2
            exit 1
          fi
          if [ "$ONLY" = true ]; then
            echo "Documentation only: tests skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.only != 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.only != 'true'
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.only != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: coverage
      - name: Coverage, as the parts measured it
        if: steps.gate.outputs.only != 'true'
        run: uv pip install --system --group test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.only != 'true'
        with:
          pattern: coverage-${{ matrix.group }}-*
          merge-multiple: true
          path: .tmp
      - name: Every part passed
        if: steps.gate.outputs.only != 'true'
        env:
          GROUP: ${{ matrix.group }}
          PAGE: ${{ needs.page.result }}
        run: |
          missing=0
          if [ "$PAGE" != success ]; then
            echo "The Boiler page's job did not pass: $PAGE" >&2
            missing=1
          fi
          for part in core acceptance control rest; do
            if [ ! -f ".tmp/coverage.$GROUP-$part" ]; then
              echo "The part '$part' did not pass: no coverage from it." >&2
              missing=1
            fi
          done
          exit "$missing"
      # P-35: every module at least 95 % with branches, the config and options flows 100 %.
      - name: Coverage of each module
        if: steps.gate.outputs.only != 'true'
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage json -o .tmp/coverage-report.json
          python - <<'PY'
          import json, sys
          files = json.load(open(".tmp/coverage-report.json", encoding="utf-8"))["files"]
          package = "custom_components/vtherm_smart_boiler/"
          floors = {package + "config_flow.py": 100.0}
          low = [
              f"{name}: {data['summary']['percent_covered']:.2f} % < {floors.get(name, 95.0):.0f} %"
              for name, data in sorted(files.items())
              if name.startswith(package)
              and data["summary"]["percent_covered"] < floors.get(name, 95.0)
          ]
          print("\n".join(low) or "every module at its floor")
          sys.exit(1 if low else 0)
          PY

  # P-109: the newest vtherm_api, beside the pinned one — a failure here is a finding: VT's API
  # changed under the plugin.
  latest-vtherm-api:
    name: Early warning – newest vtherm_api
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'qas' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-env
        with:
          group: ha
      - name: The newest vtherm_api
        run: |
          uv pip install --system -U vtherm-api
          uv pip show --system vtherm-api | head -2
      - name: Types
        run: mypy
      - name: All tests
        run: |
          mkdir -p .tmp
          python -m pytest -q -n auto -p no:homeassistant --disable-socket --allow-unix-socket tests/core
          python -m pytest -q -n auto --ignore=tests/core

  # PB-85: the newest VT and SmartPI releases (and the newest vtherm_api VT runs with) — a
  # failure here is a finding: VT or SmartPI changed under the plugin, not a broken change of
  # ours. Each release tag is resolved to its commit and fetched by that commit.
  latest-vt-smartpi:
    name: Early warning – newest Versatile Thermostat and SmartPI
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'qas' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/test-env
        with:
          group: ha
          vendor: none
      - name: The newest VT and SmartPI releases by their commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch() {  # repository, the folder under custom_components/
            local repo="$1" component="$2" tag commit
            tag="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
            commit="$(git ls-remote --tags "https://github.com/$repo.git" \
              | awk -v t="refs/tags/$tag" '$2 == t "^{}" {peeled = $1} $2 == t {plain = $1}
                                            END {print (peeled != "" ? peeled : plain)}')"
            case "$commit" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
              *) echo "$repo release $tag has no commit ('$commit')" >&2; exit 1 ;;
            esac
            echo "$repo $tag $commit"
            mkdir -p "vendor/$component-latest"
            curl -fsSL "https://github.com/$repo/archive/$commit.tar.gz" \
              | tar -xz -C "vendor/$component-latest" --strip-components=1
            ln -s "../$component-latest/custom_components/$component" \
              "vendor/custom_components/$component"
            test -f "vendor/custom_components/$component/manifest.json"
          }
          mkdir -p vendor/custom_components
          fetch jmcollin78/versatile_thermostat versatile_thermostat
          fetch KipK/vtherm_smartpi vtherm_smartpi
      - name: The newest vtherm_api and VT's and SmartPI's requirements
        run: |
          uv pip install --system -U vtherm-api
          python - <<'PY' > .tmp/upstream-requirements.txt
          import json
          for component in ("versatile_thermostat", "vtherm_smartpi"):
              path = f"vendor/custom_components/{component}/manifest.json"
              print("\n".join(json.load(open(path, encoding="utf-8")).get("requirements", [])))
          PY
          uv pip install --system -r .tmp/upstream-requirements.txt -c "$HA_CONSTRAINTS"
          uv pip show --system vtherm-api | head -2
      - name: Types
        run: mypy
      - name: All tests
        env:
          # The newest releases, not the versions the pinned tests name.
          VENDOR_VERSIONS_PINNED: "0"
        run: |
          mkdir -p .tmp
          python -m pytest -q -n auto -p no:homeassistant --disable-socket --allow-unix-socket tests/core
          python -m pytest -q -n auto --ignore=tests/core
