# Home Assistant's and HACS's checks of the integration (docs/plan-0.2.md, K2). The actions are
# pinned to full commits (PB-86): a moved branch changes nothing until the pin is updated by hand.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master, 2026-10-06

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-10-06
        with:
          # The brand ships in the integration's brand/ folder (Home Assistant 2026.3+).
          category: integration
