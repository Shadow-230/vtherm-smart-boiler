# Home Assistant's and HACS's checks of the integration (docs/plan-0.2.md, K2).
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          # The brand ships in the integration's brand/ folder (Home Assistant 2026.3+).
          category: integration
